org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# https:// folder hosting update.json and the release APKs, no trailing slash.
# Empty disables in-app updates. GitHub's "latest/download" always resolves to the newest release's assets.
UPDATE_BASE_URL=https://github.com/MinhPC/AndroidAuto/releases/latest/download
